name: Package PingScope source

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Build source archive and checksum
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $name = "PingScope-$version-source.zip"
          Compress-Archive -Path ping_scope.py, run.bat, README.md, CHANGELOG.md, LICENSE, VERSION, tests -DestinationPath $name
          $hash = (Get-FileHash -Algorithm SHA256 $name).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii "$name.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            PingScope-*-source.zip
            PingScope-*-source.zip.sha256
