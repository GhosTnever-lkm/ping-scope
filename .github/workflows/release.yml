name: Package PingScope source

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Build standalone Windows application
        run: |
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PingScope ping_scope.py
      - name: Smoke-test packaged window
        shell: pwsh
        run: ./tests/smoke_windows_exe.ps1 -ExecutablePath ./dist/PingScope.exe
      - name: Package application and source with checksums
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $app = "PingScope-$version-windows-x64.zip"
          Compress-Archive -Path dist/PingScope.exe, README.md, CHANGELOG.md, LICENSE -DestinationPath $app
          $source = "PingScope-$version-source.zip"
          Compress-Archive -Path ping_scope.py, run.bat, README.md, CHANGELOG.md, LICENSE, VERSION, requirements-build.txt, tests -DestinationPath $source
          foreach ($name in @($app, $source)) {
            $hash = (Get-FileHash -Algorithm SHA256 $name).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -Encoding ascii "$name.sha256"
          }
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            PingScope-*-windows-x64.zip
            PingScope-*-windows-x64.zip.sha256
            PingScope-*-source.zip
            PingScope-*-source.zip.sha256
